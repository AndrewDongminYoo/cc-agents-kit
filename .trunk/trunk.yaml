# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
  options:
    - commands: [ALL]
      args: --monitor=false
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
# cspell:words shfmt, taplo
lint:
  definitions:
    - name: pinact
      commands:
        - name: upgrade
          enabled: true
    - name: trufflehog
      commands:
        - name: lint
          run: trufflehog filesystem --json --fail --fail-on-scan-errors --no-verification --no-update ${target}
          direct_configs:
            - .trunk/configs/trufflehog_to_sarif.py
          parser:
            runtime: python
            run: python3 .trunk/configs/trufflehog_to_sarif.py
  disabled:
    - bandit
    - shfmt
    - taplo
  enabled:
    - actionlint@1.7.12
    - black@26.10.1
    - checkov@3.4.0
    - git-diff-check
    - isort@9.0.2
    - markdownlint@0.50.0
    - pinact@4.1.1!
    - prettier@3.9.10
    - ruff@0.17.3
    - shellcheck@0.11.0
    - trivy@0.76.1
    - trufflehog@3.99.7
    - yamllint@1.38.0
  ignore:
    # Operator confirmed both credential-shaped constants are never-issued fixtures.
    # This exact test file is excluded only from TruffleHog; all other checks remain.
    - linters: [trufflehog]
      paths: [plugins/guard-hooks/hooks/output-secret-mask.test.py]
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
