name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hooks:
    # macOS is not redundant: its /bin/bash is 3.2, the oldest bash the hooks
    # claim to support, and the suites invoke the hooks through /bin/bash. A
    # 3.2-only fault (an empty array under `set -u`, for one) passes on Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install shellcheck
          else
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi

      # Present on the Linux image, absent on the macOS one. The frontmatter
      # check needs a real parser: asserting that it parses is the point.
      - name: Ensure pyyaml
        run: python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --disable-pip-version-check --break-system-packages pyyaml

      - name: Report the bash under test
        run: /bin/bash -c 'echo "/bin/bash is $BASH_VERSION"'

      - name: Validate manifests
        run: |
          for f in .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json plugins/*/hooks/hooks.json; do
            python3 - "$f" <<'PY'
          import json, sys

          def reject_nonstandard_constant(value):
              raise ValueError(f"nonstandard JSON constant {value}")

          with open(sys.argv[1], encoding="utf-8") as manifest_file:
              json.load(manifest_file, parse_constant=reject_nonstandard_constant)
          PY
          done

      - name: Every marketplace plugin source exists
        run: |
          python3 - <<'PY'
          import json, pathlib, sys

          def reject_nonstandard_constant(value):
              raise ValueError(f"nonstandard JSON constant {value}")

          marketplace_path = pathlib.Path(".claude-plugin/marketplace.json")
          marketplace_root = marketplace_path.parent.parent.resolve()
          try:
              with marketplace_path.open(encoding="utf-8") as marketplace_file:
                  m = json.load(marketplace_file, parse_constant=reject_nonstandard_constant)
          except (OSError, UnicodeError, ValueError) as error:
              sys.exit(f"marketplace.json cannot be parsed: {error}")
          if not isinstance(m, dict):
              sys.exit("marketplace.json root must be an object")
          plugins = m.get("plugins")
          if not isinstance(plugins, list):
              sys.exit("marketplace.json: plugins must be a list")
          bad, names, sources = [], {}, {}
          for index, entry in enumerate(plugins):
              label = f"marketplace.json plugins[{index}]"
              if not isinstance(entry, dict):
                  bad.append(f"{label}: entry must be an object")
                  continue
              name, source = entry.get("name"), entry.get("source")
              valid_name = isinstance(name, str) and bool(name)
              if not valid_name:
                  bad.append(f"{label}: name must be a non-empty string")
              elif name in names:
                  bad.append(f"{label}: duplicate name {name!r} (also {names[name]})")
              else:
                  names[name] = label
              if not isinstance(source, str) or not source:
                  bad.append(f"{label}: missing or invalid source {source!r}")
                  continue
              if not source.startswith("./"):
                  bad.append(f"{label}: source must be a ./ relative path: {source!r}")
                  continue
              source_path = pathlib.Path(source)
              if ".." in source_path.parts:
                  bad.append(f"{label}: source path must not contain '..': {source!r}")
                  continue
              source_key = source_path.resolve()
              try:
                  source_key.relative_to(marketplace_root)
              except ValueError:
                  bad.append(f"{label}: source resolves outside the marketplace root: {source!r}")
                  continue
              if source_key in sources:
                  previous_source, previous_label = sources[source_key]
                  bad.append(
                      f"{label}: duplicate source {source!r} resolves to the same path as "
                      f"{previous_source!r} ({previous_label})"
                  )
              else:
                  sources[source_key] = (source, label)
              if not source_key.is_dir():
                  bad.append(f"{label}: source directory missing: {source}")
                  continue
              manifest_path = source_key / ".claude-plugin" / "plugin.json"
              if not manifest_path.is_file():
                  bad.append(f"{label}: source manifest missing: {manifest_path}")
                  continue
              try:
                  with manifest_path.open(encoding="utf-8") as manifest_file:
                      manifest = json.load(manifest_file, parse_constant=reject_nonstandard_constant)
              except (OSError, UnicodeError, ValueError) as error:
                  bad.append(f"{label}: source manifest cannot be parsed {manifest_path}: {error}")
                  continue
              if not isinstance(manifest, dict):
                  bad.append(f"{label}: source manifest must be a JSON object: {manifest_path}")
                  continue
              if valid_name and manifest.get("name") != name:
                  bad.append(f"{label}: manifest name {manifest.get('name')!r} != entry name {name!r}: {manifest_path}")
          if bad:
              sys.exit("marketplace plugin validation failed:\n" + "\n".join(bad))
          print(f'{len(m["plugins"])} marketplace plugin source(s) and manifest(s) valid')
          PY

      - name: Every wired hook exists
        run: |
          python3 - <<'PY'
          import json, pathlib, sys

          def reject_nonstandard_constant(value):
              raise ValueError(f"nonstandard JSON constant {value}")

          wired, missing = 0, []
          for hooks_json in sorted(pathlib.Path("plugins").glob("*/hooks/hooks.json")):
              root = hooks_json.parent.parent
              with hooks_json.open(encoding="utf-8") as hooks_file:
                  hooks_manifest = json.load(hooks_file, parse_constant=reject_nonstandard_constant)
              for groups in hooks_manifest["hooks"].values():
                  for group in groups:
                      for hook in group["hooks"]:
                          name = hook["command"].split("/hooks/")[-1].rstrip('"')
                          wired += 1
                          if not (root / "hooks" / name).is_file():
                              missing.append(f"{root.name}: {name}")
          if missing:
              sys.exit(f"hooks.json wires missing scripts: {missing}")
          print(f"{wired} wired hook(s) present")
          PY

      - name: Every skill has parseable frontmatter with a name and description
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml
          bad, n = [], 0
          for f in sorted(pathlib.Path("plugins").glob("*/skills/*/SKILL.md")):
              n += 1
              try:
                  d = yaml.safe_load(f.read_text().split("---\n")[1])
              except Exception as e:
                  bad.append(f"{f}: frontmatter does not parse ({e})"); continue
              for key in ("name", "description"):
                  if not (d or {}).get(key):
                      bad.append(f"{f}: missing {key}")
              if (d or {}).get("name") != f.parent.name:
                  bad.append(f"{f}: name {d.get('name')!r} != directory {f.parent.name!r}")
          if bad:
              sys.exit("\n".join(bad))
          print(f"{n} skill(s) ok")
          PY

      # An absolute home path is a leak unless it is an obvious placeholder.
      # `.zprofile.secrets` is deliberately NOT matched — it is the path
      # secrets-path-guard exists to protect, so its presence is the feature.
      - name: No private or machine-specific references
        run: |
          hits=$(grep -rniE '/Users/[a-z]|/Volumes/[a-z]|llm-wiki|ydm2790' plugins/ \
                 | grep -vE '/Users/(me|you|user|USERNAME|<[a-z]+>)\b' || true)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits" >&2
            echo "^ published plugins must not carry machine-specific paths" >&2
            exit 1
          fi
          echo "no private references"

      # Cover both named shell scripts and extensionless Bash plugin bin entries.
      # Listed once; the two steps below consume the same NUL-delimited list.
      - name: List every shipped shell script
        run: |
          python3 - <<'PY' >"$RUNNER_TEMP/shell-files.z"
          import os, pathlib, sys
          for f in sorted(pathlib.Path(".").rglob("*")):
              if not f.is_file() or ".git" in f.parts:
                  continue
              first_line = f.open("rb").readline()
              is_bash_bin = len(f.parts) == 4 and f.parts[0] == "plugins" and f.parts[2] == "bin" and f.suffix == "" and b"bash" in first_line
              if f.suffix == ".sh" or is_bash_bin:
                  sys.stdout.buffer.write(os.fsencode(str(f)) + b"\0")
          PY
          # An empty list would make both steps below pass without reading a file.
          test -s "$RUNNER_TEMP/shell-files.z" || { echo "no shell scripts found — the discovery above is broken" >&2; exit 1; }
          tr '\0' '\n' <"$RUNNER_TEMP/shell-files.z"

      - name: Shellcheck
        run: xargs -0 shellcheck <"$RUNNER_TEMP/shell-files.z"

      - name: Parse under /bin/bash
        run: xargs -0 -n1 /bin/bash -n <"$RUNNER_TEMP/shell-files.z"

      # A bin/ entry that is not executable, or has no shebang, is on PATH and
      # unrunnable — the failure a skill referencing it by bare name cannot see.
      - name: Plugin bin/ entries are runnable
        run: |
          python3 - <<'PY'
          import os, pathlib, sys
          bad, n = [], 0
          for f in sorted(pathlib.Path("plugins").glob("*/bin/*")):
              if not f.is_file():
                  continue
              n += 1
              if not os.access(f, os.X_OK):
                  bad.append(f"{f}: not executable")
              if not f.read_bytes().startswith(b"#!"):
                  bad.append(f"{f}: no shebang")
          if bad:
              sys.exit("\n".join(bad))
          print(f"{n} bin/ entr(ies) runnable")
          PY

      # The demo hardcodes the text zsh-quoting-guard prints. It drifted once
      # already, so compare against what the hook actually emits rather than
      # against its source — part of the message is assembled at runtime.
      - name: Demo quotes the guard's current message
        run: |
          python3 - <<'PY'
          import json, pathlib, re, subprocess, sys
          payload = json.dumps({"tool_input": {"command": "find . " + "-name *.md"}})
          out = subprocess.run(
              ["/bin/bash", "plugins/guard-hooks/hooks/zsh-quoting-guard.sh"],
              input=payload, capture_output=True, text=True)
          if out.returncode != 2:
              sys.exit(f"expected the guard to block, got exit {out.returncode}")
          printed = out.stderr
          demo = pathlib.Path("docs/demo.sh").read_text()
          quoted = re.findall(r'say "\$R" "([^"]+)"', demo)
          fragments = [q for q in quoted if not q.startswith(("PreToolUse:", "# "))]
          if not fragments:
              sys.exit("docs/demo.sh no longer quotes the guard message — update this check")
          missing = [f for f in fragments if f.replace("\\", "") not in printed]
          if missing:
              sys.exit("docs/demo.sh shows text the hook does not print:\n  " + "\n  ".join(missing))
          print(f"{len(fragments)} quoted fragment(s) match what the hook prints")
          PY

      - name: Hook regression suites
        run: |
          cd plugins/guard-hooks/hooks
          for t in *.test.py; do python3 "$t" || exit 1; done

      - name: bin regression suites
        run: |
          for t in plugins/*/bin/*.test.py; do python3 "$t" || exit 1; done
